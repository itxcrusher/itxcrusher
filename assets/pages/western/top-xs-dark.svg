<svg width="280" height="994" viewBox="0 0 280 994" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Opening statement and the runnable check</title>
<desc>I build infrastructure and bounded automation for other people's production systems. Terraform, Kubernetes, CI/CD, and lately agents that act on evidence they can prove instead of guessing. Most of that work is in private client and product repositories, so what is public here is a sample rather than the volume. The contribution graph counts it. The repository list cannot show it. If infrastructure feels exciting, something is probably wrong. The goal is systems that are quiet, predictable, and uninteresting in production.</desc>
<rect x="0" y="0" width="280" height="994" fill="#2a1206"/>
<rect x="18" y="678.38" width="244" height="167.9" rx="2.4" fill="#1b0c04" fill-opacity="1"/>
<rect x="18" y="488.8" width="244" height="478.98" rx="0" fill="#48220d" fill-opacity="1"/>
<rect x="18.75" y="489.55" width="242.5" height="477.48" rx="0" fill="none" stroke="#ff9d3a" stroke-opacity="0.45" stroke-width="1.4"/>
<rect x="18" y="488.8" width="4" height="478.98" rx="0" fill="#ff9d3a" fill-opacity="0.9"/>
<text x="18" y="25.6" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">I build infrastructure and</text>
<text x="18" y="48.8" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">bounded automation for other</text>
<text x="18" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">people's production systems.</text>
<text x="18" y="95.2" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">Terraform, Kubernetes, CI/CD,</text>
<text x="18" y="118.4" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">and lately agents that act on</text>
<text x="18" y="141.6" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">evidence they can prove instead</text>
<text x="18" y="164.8" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">of guessing.</text>
<text x="18" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">Most of that work is in private</text>
<text x="18" y="223.2" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">client and product repositories,</text>
<text x="18" y="246.4" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">so what is public here is a</text>
<text x="18" y="269.6" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">sample rather than the volume.</text>
<text x="18" y="292.8" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">The contribution graph counts</text>
<text x="18" y="316" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">it. The repository list cannot</text>
<text x="18" y="339.2" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">show it.</text>
<text x="18" y="374.4" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">If infrastructure feels exciting,</text>
<text x="18" y="397.6" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">something is probably wrong.</text>
<text x="18" y="420.8" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">The goal is systems that are</text>
<text x="18" y="444" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">quiet, predictable, and</text>
<text x="18" y="467.2" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#ffe8c8">uninteresting in production.</text>
<text x="31.6" y="521.4" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#ff9d3a">Want to check whether any of this is real?</text>
<text x="18" y="543.88" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#ffe8c8">ripple-proof audits a full</text>
<text x="18" y="564.18" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#ffe8c8">captured campaign offline in</text>
<text x="18" y="584.48" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#ffe8c8">about a minute, with Python 3.11</text>
<text x="18" y="604.78" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#ffe8c8">and nothing else. No install, no</text>
<text x="18" y="625.08" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#ffe8c8">account, no credential, no</text>
<text x="18" y="645.38" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#ffe8c8">network call. It prints every</text>
<text x="18" y="665.68" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#ffe8c8">point where it refused to act.</text>
<text x="26" y="700.38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ffe8c8">git clone https://github</text>
<text x="26" y="722.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ffe8c8">.com/itxcrusher/ripple-p</text>
<text x="26" y="743.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ffe8c8">roof</text>
<text x="26" y="765.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ffe8c8">cd ripple-proof</text>
<text x="26" y="787.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ffe8c8">PYTHONPATH=src python -S</text>
<text x="26" y="808.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ffe8c8"> -m lineage_agent.cli de</text>
<text x="26" y="830.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#ffe8c8">mo</text>
<text x="18" y="866.68" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#c09a6e">Expect CAMPAIGN AUDIT:</text>
<text x="18" y="886.98" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#c09a6e">PASSED, 11 of 11 checks. The</text>
<text x="18" y="907.28" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#c09a6e">walkthrough keeps one run that</text>
<text x="18" y="927.58" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#c09a6e">fails its dbt build on purpose</text>
<text x="18" y="947.88" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="400" fill="#c09a6e">rather than dropping it.</text>
</svg>
