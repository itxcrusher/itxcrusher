<svg width="600" height="1083" viewBox="0 0 600 1083" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Muhammad Hassaan Javed, @itxcrusher. Western theme.</title>
<desc>I build infrastructure and bounded automation for other people's production systems. Terraform, Kubernetes, CI/CD, and lately agents that act on evidence they can prove instead of guessing. Most of that work is in private client and product repositories, so what is public here is a sample rather than the volume. The contribution graph counts it. The repository list cannot show it. If infrastructure feels exciting, something is probably wrong. The goal is systems that are quiet, predictable, and uninteresting in production.</desc>
<rect x="0" y="0" width="600" height="1083" fill="#f5e9d0"/>
<line x1="32" y1="155.22" x2="257.12" y2="155.22" stroke="#763c12" stroke-opacity="0.8" stroke-width="2.444"/>
<rect x="32" y="761.08" width="536" height="169.25" rx="3.3" fill="#faf5ea" fill-opacity="1"/>
<rect x="32" y="583.12" width="536" height="457.36" rx="4.4" fill="#e4cba0" fill-opacity="1"/>
<rect x="32.75" y="583.87" width="534.5" height="455.86" rx="3.65" fill="none" stroke="#763c12" stroke-opacity="0.45" stroke-width="1.4"/>
<rect x="32" y="583.12" width="3.143" height="457.36" rx="0" fill="#763c12" fill-opacity="0.9"/>
<text x="32" y="73.4" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700" fill="#3a230c">Muhammad Hassaan Javed</text>
<text x="32" y="132.8" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#763c12">@itxcrusher</text>
<text x="32" y="201.42" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">I build infrastructure and bounded automation for</text>
<text x="32" y="233.32" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">other people's production systems. Terraform,</text>
<text x="32" y="265.22" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">Kubernetes, CI/CD, and lately agents that act on</text>
<text x="32" y="297.12" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">evidence they can prove instead of guessing.</text>
<text x="32" y="345.52" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">Most of that work is in private client and product</text>
<text x="32" y="377.42" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">repositories, so what is public here is a sample</text>
<text x="32" y="409.32" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">rather than the volume. The contribution graph</text>
<text x="32" y="441.22" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">counts it. The repository list cannot show it.</text>
<text x="32" y="489.62" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">If infrastructure feels exciting, something is</text>
<text x="32" y="521.52" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">probably wrong. The goal is systems that are quiet,</text>
<text x="32" y="553.42" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#3a230c">predictable, and uninteresting in production.</text>
<text x="50.7" y="629.82" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#763c12">Want to check whether any of this is real?</text>
<text x="32" y="661.08" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#3a230c">ripple-proof audits a full captured campaign offline in</text>
<text x="32" y="688.63" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#3a230c">about a minute, with Python 3.11 and nothing else. No</text>
<text x="32" y="716.18" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#3a230c">install, no account, no credential, no network call. It</text>
<text x="32" y="743.73" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#3a230c">prints every point where it refused to act.</text>
<text x="43" y="791.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#3a230c">git clone https://github.com/itxcrusher/rip</text>
<text x="43" y="820.53" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#3a230c">ple-proof</text>
<text x="43" y="849.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#3a230c">cd ripple-proof</text>
<text x="43" y="879.43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#3a230c">PYTHONPATH=src python -S -m lineage_agent.c</text>
<text x="43" y="908.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#3a230c">li demo</text>
<text x="32" y="958.13" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#7f5f38">Expect CAMPAIGN AUDIT: PASSED, 11 of 11 checks.</text>
<text x="32" y="985.68" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#7f5f38">The walkthrough keeps one run that fails its dbt build</text>
<text x="32" y="1013.23" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#7f5f38">on purpose rather than dropping it.</text>
</svg>
