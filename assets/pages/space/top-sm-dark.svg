<text x="26" y="25.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">I build infrastructure and bounded automation for</text>
<text x="26" y="48.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">other people's production systems. Terraform,</text>
<text x="26" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">Kubernetes, CI/CD, and lately agents that act on</text>
<text x="26" y="95.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">evidence they can prove instead of guessing.</text>
<text x="26" y="130.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">Most of that work is in private client and product</text>
<text x="26" y="153.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">repositories, so what is public here is a sample rather</text>
<text x="26" y="176.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">than the volume. The contribution graph counts it.</text>
<text x="26" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">The repository list cannot show it.</text>
<text x="26" y="235.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">If infrastructure feels exciting, something is probably</text>
<text x="26" y="258.4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">wrong. The goal is systems that are quiet, predictable,</text>
<text x="26" y="281.6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#eef2ff">and uninteresting in production.</text>
<text x="39.6" y="335.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#8ea6ff">Want to check whether any of this is real?</text>
<text x="26" y="358.28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#eef2ff">ripple-proof audits a full captured campaign offline in</text>
<text x="26" y="378.58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#eef2ff">about a minute, with Python 3.11 and nothing else. No</text>
<text x="26" y="398.88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#eef2ff">install, no account, no credential, no network call. It prints</text>
<text x="26" y="419.18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#eef2ff">every point where it refused to act.</text>
<text x="34" y="453.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef2ff">git clone https://github.com/itxcrusher/ripp</text>
<text x="34" y="475.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef2ff">le-proof</text>
<text x="34" y="497.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef2ff">cd ripple-proof</text>
<text x="34" y="518.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef2ff">PYTHONPATH=src python -S -m lineage_agent.cl</text>
<text x="34" y="540.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#eef2ff">i demo</text>
<text x="26" y="576.78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#8390bd">Expect CAMPAIGN AUDIT: PASSED, 11 of 11 checks. The</text>
<text x="26" y="597.08" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#8390bd">walkthrough keeps one run that fails its dbt build on</text>
<text x="26" y="617.38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#8390bd">purpose rather than dropping it.</text>
