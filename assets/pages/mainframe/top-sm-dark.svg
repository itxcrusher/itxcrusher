<svg width="460" height="1098" viewBox="0 0 460 1098" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Muhammad Hassaan Javed, @itxcrusher. Mainframe theme.</title>
<desc>I build infrastructure and bounded automation for other people's production systems. Terraform, Kubernetes, CI/CD, and lately agents that act on evidence they can prove instead of guessing. Most of that work is in private client and product repositories, so what is public here is a sample rather than the volume. The contribution graph counts it. The repository list cannot show it. If infrastructure feels exciting, something is probably wrong. The goal is systems that are quiet, predictable, and uninteresting in production.</desc>
<rect x="0" y="0" width="460" height="1098" fill="#0d1a12"/>
<line x1="26" y1="127.74" x2="197.36" y2="127.74" stroke="#9ee493" stroke-opacity="0.8" stroke-width="2"/>
<rect x="26" y="819.18" width="408" height="134.25" rx="2.7" fill="#08110c" fill-opacity="1"/>
<rect x="26" y="634.44" width="408" height="428.49" rx="3.6" fill="#112318" fill-opacity="1"/>
<rect x="26.75" y="635.19" width="406.5" height="426.99" rx="2.85" fill="none" stroke="#9ee493" stroke-opacity="0.45" stroke-width="1.4"/>
<rect x="26" y="634.44" width="3" height="428.49" rx="0" fill="#9ee493" fill-opacity="0.9"/>
<text x="26" y="60.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="29" font-weight="700" fill="#dfe9d3">Muhammad Hassaan Javed</text>
<text x="26" y="109.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="38" font-weight="700" fill="#9ee493">@itxcrusher</text>
<text x="26" y="165.54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">I build infrastructure and bounded</text>
<text x="26" y="191.64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">automation for other people's</text>
<text x="26" y="217.74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">production systems. Terraform,</text>
<text x="26" y="243.84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">Kubernetes, CI/CD, and lately agents</text>
<text x="26" y="269.94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">that act on evidence they can prove</text>
<text x="26" y="296.04" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">instead of guessing.</text>
<text x="26" y="335.64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">Most of that work is in private client</text>
<text x="26" y="361.74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">and product repositories, so what is</text>
<text x="26" y="387.84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">public here is a sample rather than</text>
<text x="26" y="413.94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">the volume. The contribution graph</text>
<text x="26" y="440.04" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">counts it. The repository list cannot</text>
<text x="26" y="466.14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">show it.</text>
<text x="26" y="505.74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">If infrastructure feels exciting,</text>
<text x="26" y="531.84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">something is probably wrong. The goal</text>
<text x="26" y="557.94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">is systems that are quiet,</text>
<text x="26" y="584.04" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">predictable, and uninteresting in</text>
<text x="26" y="610.14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#dfe9d3">production.</text>
<text x="41.3" y="671.74" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" fill="#9ee493">Want to check whether any of this is real?</text>
<text x="26" y="696.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">ripple-proof audits a full captured</text>
<text x="26" y="718.23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">campaign offline in about a minute, with</text>
<text x="26" y="739.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">Python 3.11 and nothing else. No install,</text>
<text x="26" y="761.73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">no account, no credential, no network call.</text>
<text x="26" y="783.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">It prints every point where it refused to</text>
<text x="26" y="805.23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">act.</text>
<text x="35" y="843.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">git clone https://github.com/itxcrusher/r</text>
<text x="35" y="866.43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">ipple-proof</text>
<text x="35" y="889.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">cd ripple-proof</text>
<text x="35" y="912.93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">PYTHONPATH=src python -S -m lineage_agent</text>
<text x="35" y="936.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#dfe9d3">.cli demo</text>
<text x="26" y="975.63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#7d9a78">Expect CAMPAIGN AUDIT: PASSED, 11 of 11</text>
<text x="26" y="997.38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#7d9a78">checks. The walkthrough keeps one run that</text>
<text x="26" y="1019.13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#7d9a78">fails its dbt build on purpose rather than</text>
<text x="26" y="1040.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#7d9a78">dropping it.</text>
</svg>
