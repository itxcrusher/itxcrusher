<text x="18" y="25.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">I build infrastructure and</text>
<text x="18" y="48.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">bounded automation for</text>
<text x="18" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">other people's production</text>
<text x="18" y="95.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">systems. Terraform,</text>
<text x="18" y="118.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">Kubernetes, CI/CD, and</text>
<text x="18" y="141.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">lately agents that act on</text>
<text x="18" y="164.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">evidence they can prove</text>
<text x="18" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">instead of guessing.</text>
<text x="18" y="223.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">Most of that work is in</text>
<text x="18" y="246.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">private client and product</text>
<text x="18" y="269.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">repositories, so what is</text>
<text x="18" y="292.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">public here is a sample</text>
<text x="18" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">rather than the volume.</text>
<text x="18" y="339.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">The contribution graph</text>
<text x="18" y="362.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">counts it. The repository</text>
<text x="18" y="385.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">list cannot show it.</text>
<text x="18" y="420.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">If infrastructure feels</text>
<text x="18" y="444" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">exciting, something is</text>
<text x="18" y="467.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">probably wrong. The goal</text>
<text x="18" y="490.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">is systems that are quiet,</text>
<text x="18" y="513.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">predictable, and</text>
<text x="18" y="536.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">uninteresting in</text>
<text x="18" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e9f0ff">production.</text>
<text x="31.6" y="614.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#4f8cff">Want to check whether any of this is real?</text>
<text x="18" y="636.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">ripple-proof audits a full</text>
<text x="18" y="656.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">captured campaign offline</text>
<text x="18" y="677.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">in about a minute, with</text>
<text x="18" y="697.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">Python 3.11 and nothing</text>
<text x="18" y="717.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">else. No install, no</text>
<text x="18" y="738.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">account, no credential, no</text>
<text x="18" y="758.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">network call. It prints</text>
<text x="18" y="778.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">every point where it</text>
<text x="18" y="799.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">refused to act.</text>
<text x="26" y="833.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">git clone https://github</text>
<text x="26" y="855.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">.com/itxcrusher/ripple-p</text>
<text x="26" y="877.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">roof</text>
<text x="26" y="898.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">cd ripple-proof</text>
<text x="26" y="920.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">PYTHONPATH=src python -S</text>
<text x="26" y="942.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff"> -m lineage_agent.cli de</text>
<text x="26" y="963.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e9f0ff">mo</text>
<rect x="61.524" y="952.78" width="7" height="14" fill="#4f8cff" fill-opacity="0.95" class="a4"/>
<text x="18" y="1000.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6c7fa3">Expect CAMPAIGN AUDIT:</text>
<text x="18" y="1020.38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6c7fa3">PASSED, 11 of 11 checks.</text>
<text x="18" y="1040.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6c7fa3">The walkthrough keeps one</text>
<text x="18" y="1060.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6c7fa3">run that fails its dbt</text>
<text x="18" y="1081.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6c7fa3">build on purpose rather</text>
<text x="18" y="1101.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6c7fa3">than dropping it.</text>
</svg>
