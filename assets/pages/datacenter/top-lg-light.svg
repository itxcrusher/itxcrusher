<text x="44" y="30.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0d1117">I build infrastructure and bounded automation for other people's</text>
<text x="44" y="57.95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0d1117">production systems. Terraform, Kubernetes, CI/CD, and lately agents that</text>
<text x="44" y="85.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0d1117">act on evidence they can prove instead of guessing.</text>
<text x="44" y="127.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0d1117">Most of that work is in private client and product repositories, so what</text>
<text x="44" y="154.85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0d1117">is public here is a sample rather than the volume. The contribution graph</text>
<text x="44" y="182.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0d1117">counts it. The repository list cannot show it.</text>
<text x="44" y="224.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0d1117">If infrastructure feels exciting, something is probably wrong. The goal</text>
<text x="44" y="251.75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0d1117">is systems that are quiet, predictable, and uninteresting in production.</text>
<text x="62.05" y="332.73" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0d1117">ripple-proof audits a full captured campaign offline in about a minute, with Python</text>
<text x="62.05" y="355.93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0d1117">3.11 and nothing else. No install, no account, no credential, no network call. It</text>
<text x="62.05" y="379.13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0d1117">prints every point where it refused to act.</text>
<text x="71.55" y="419.43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#14622b">$</text>
<text x="90.206" y="419.43" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0d1117">git clone https://github.com/itxcrusher/ripple-proof</text>
<text x="71.55" y="444.23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#14622b">$</text>
<text x="90.206" y="444.23" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0d1117">cd ripple-proof</text>
<text x="71.55" y="469.03" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#14622b">$</text>
<text x="90.206" y="469.03" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0d1117">PYTHONPATH=src python -S -m lineage_agent.cli demo</text>
<rect x="563.006" y="456.23" width="8" height="16" fill="#14622b" fill-opacity="0.95" class="a3"/>
<text x="62.05" y="510.93" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#57606a">Expect CAMPAIGN AUDIT: PASSED, 11 of 11 checks. The walkthrough keeps one run that</text>
<text x="62.05" y="534.13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#57606a">fails its dbt build on purpose rather than dropping it.</text>
<text x="111.45" y="297.41" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#57606a">Want to check whether any of this is real?</text>
