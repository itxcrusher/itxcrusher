<svg width="280" height="1141" viewBox="0 0 280 1141" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Opening statement and the runnable check</title>
<desc>I build infrastructure and bounded automation for other people's production systems. Terraform, Kubernetes, CI/CD, and lately agents that act on evidence they can prove instead of guessing. Most of that work is in private client and product repositories, so what is public here is a sample rather than the volume. The contribution graph counts it. The repository list cannot show it. If infrastructure feels exciting, something is probably wrong. The goal is systems that are quiet, predictable, and uninteresting in production.</desc>
<style>@keyframes k2{0%,49%{opacity:1}50%,100%{opacity:0}}.a3{animation:k2 1.1s steps(1) infinite}</style>
<defs><pattern id="p1" width="45.033" height="78" patternUnits="userSpaceOnUse"><polygon points="45.033,39 22.517,52 0,39 0,13 22.517,0 45.033,13" fill="none" stroke="#3ddc84" stroke-opacity="0.5" stroke-width="1"/><polygon points="45.033,39 22.517,52 0,39 0,13 22.517,0 45.033,13" fill="none" stroke="#3ddc84" stroke-opacity="0.5" stroke-width="1" transform="translate(22.517,39)"/></pattern></defs>
<rect x="0" y="0" width="280" height="1141" fill="#0b0f14"/>
<g opacity="0.14">
<rect x="0" y="0" width="280" height="1141" fill="url(#p1)"/>
</g>
<rect x="33.2" y="803.82" width="213.6" height="167.9" rx="1.92" fill="#07090c" fill-opacity="1"/>
<rect x="18" y="581.6" width="244" height="533.52" rx="1.6" fill="#11171e" fill-opacity="1"/>
<rect x="18" y="581.6" width="244" height="24" rx="1.6" fill="#151c24" fill-opacity="1"/>
<rect x="18" y="599.6" width="244" height="6" rx="0" fill="#151c24" fill-opacity="1"/>
<rect x="18.75" y="582.35" width="242.5" height="532.02" rx="0.85" fill="none" stroke="#3ddc84" stroke-opacity="0.45" stroke-width="1.4"/>
<circle cx="30.8" cy="593.6" r="2.88" fill="#ff5f57" fill-opacity="0.9"/>
<circle cx="42.8" cy="593.6" r="2.88" fill="#febc2e" fill-opacity="0.9"/>
<circle cx="54.8" cy="593.6" r="2.88" fill="#28c840" fill-opacity="0.9"/>
<text x="18" y="25.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">I build infrastructure and</text>
<text x="18" y="48.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">bounded automation for</text>
<text x="18" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">other people's production</text>
<text x="18" y="95.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">systems. Terraform,</text>
<text x="18" y="118.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">Kubernetes, CI/CD, and</text>
<text x="18" y="141.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">lately agents that act on</text>
<text x="18" y="164.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">evidence they can prove</text>
<text x="18" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">instead of guessing.</text>
<text x="18" y="223.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">Most of that work is in</text>
<text x="18" y="246.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">private client and product</text>
<text x="18" y="269.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">repositories, so what is</text>
<text x="18" y="292.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">public here is a sample</text>
<text x="18" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">rather than the volume.</text>
<text x="18" y="339.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">The contribution graph</text>
<text x="18" y="362.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">counts it. The repository</text>
<text x="18" y="385.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">list cannot show it.</text>
<text x="18" y="420.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">If infrastructure feels</text>
<text x="18" y="444" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">exciting, something is</text>
<text x="18" y="467.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">probably wrong. The goal</text>
<text x="18" y="490.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">is systems that are quiet,</text>
<text x="18" y="513.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">predictable, and</text>
<text x="18" y="536.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">uninteresting in</text>
<text x="18" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e6edf3">production.</text>
<text x="33.2" y="628.72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">ripple-proof audits a full</text>
<text x="33.2" y="649.02" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">captured campaign offline</text>
<text x="33.2" y="669.32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">in about a minute, with</text>
<text x="33.2" y="689.62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">Python 3.11 and nothing</text>
<text x="33.2" y="709.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">else. No install, no</text>
<text x="33.2" y="730.22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">account, no credential, no</text>
<text x="33.2" y="750.52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">network call. It prints</text>
<text x="33.2" y="770.82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">every point where it</text>
<text x="33.2" y="791.12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">refused to act.</text>
<text x="41.2" y="825.82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3ddc84">$</text>
<text x="57.524" y="825.82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">git clone https://gith</text>
<text x="41.2" y="847.52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">ub.com/itxcrusher/ripp</text>
<text x="41.2" y="869.22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">le-proof</text>
<text x="41.2" y="890.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3ddc84">$</text>
<text x="57.524" y="890.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">cd ripple-proof</text>
<text x="41.2" y="912.62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3ddc84">$</text>
<text x="57.524" y="912.62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">PYTHONPATH=src python </text>
<text x="41.2" y="934.32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">-S -m lineage_agent.cl</text>
<text x="41.2" y="956.02" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e6edf3">i demo</text>
<rect x="95.772" y="944.82" width="7" height="14" fill="#3ddc84" fill-opacity="0.95" class="a3"/>
<text x="33.2" y="992.12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#7d8b99">Expect CAMPAIGN AUDIT:</text>
<text x="33.2" y="1012.42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#7d8b99">PASSED, 11 of 11 checks.</text>
<text x="33.2" y="1032.72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#7d8b99">The walkthrough keeps one</text>
<text x="33.2" y="1053.02" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#7d8b99">run that fails its dbt</text>
<text x="33.2" y="1073.32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#7d8b99">build on purpose rather</text>
<text x="33.2" y="1093.62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#7d8b99">than dropping it.</text>
<text x="74.8" y="598.64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#7d8b99">Want to check whether any of this is real?</text>
</svg>
