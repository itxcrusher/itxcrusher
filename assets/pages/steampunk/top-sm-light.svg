<svg width="460" height="954" viewBox="0 0 460 954" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Muhammad Hassaan Javed, @itxcrusher. Steampunk theme.</title>
<desc>I build infrastructure and bounded automation for other people's production systems. Terraform, Kubernetes, CI/CD, and lately agents that act on evidence they can prove instead of guessing. Most of that work is in private client and product repositories, so what is public here is a sample rather than the volume. The contribution graph counts it. The repository list cannot show it. If infrastructure feels exciting, something is probably wrong. The goal is systems that are quiet, predictable, and uninteresting in production.</desc>
<rect x="0" y="0" width="460" height="954" fill="#f3e9d8"/>
<line x1="26" y1="127.74" x2="197.36" y2="127.74" stroke="#644514" stroke-opacity="0.8" stroke-width="2"/>
<rect x="26" y="697.38" width="408" height="134.25" rx="2.7" fill="#faf5ed" fill-opacity="1"/>
<rect x="26" y="556.14" width="408" height="363.24" rx="3.6" fill="#e5d1af" fill-opacity="1"/>
<rect x="26.75" y="556.89" width="406.5" height="361.74" rx="2.85" fill="none" stroke="#644514" stroke-opacity="0.45" stroke-width="1.4"/>
<rect x="26" y="556.14" width="3" height="363.24" rx="0" fill="#644514" fill-opacity="0.9"/>
<text x="26" y="60.2" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" fill="#3a2612">Muhammad Hassaan Javed</text>
<text x="26" y="109.28" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" fill="#644514">@itxcrusher</text>
<text x="26" y="165.54" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">I build infrastructure and bounded automation</text>
<text x="26" y="191.64" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">for other people's production systems.</text>
<text x="26" y="217.74" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">Terraform, Kubernetes, CI/CD, and lately</text>
<text x="26" y="243.84" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">agents that act on evidence they can prove</text>
<text x="26" y="269.94" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">instead of guessing.</text>
<text x="26" y="309.54" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">Most of that work is in private client and</text>
<text x="26" y="335.64" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">product repositories, so what is public here is a</text>
<text x="26" y="361.74" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">sample rather than the volume. The</text>
<text x="26" y="387.84" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">contribution graph counts it. The repository list</text>
<text x="26" y="413.94" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">cannot show it.</text>
<text x="26" y="453.54" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">If infrastructure feels exciting, something is</text>
<text x="26" y="479.64" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">probably wrong. The goal is systems that are</text>
<text x="26" y="505.74" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">quiet, predictable, and uninteresting in</text>
<text x="26" y="531.84" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">production.</text>
<text x="41.3" y="593.44" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#644514">Want to check whether any of this is real?</text>
<text x="26" y="618.18" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#3a2612">ripple-proof audits a full captured campaign offline in</text>
<text x="26" y="639.93" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#3a2612">about a minute, with Python 3.11 and nothing else.</text>
<text x="26" y="661.68" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#3a2612">No install, no account, no credential, no network call.</text>
<text x="26" y="683.43" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#3a2612">It prints every point where it refused to act.</text>
<text x="35" y="721.38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#3a2612">git clone https://github.com/itxcrusher/r</text>
<text x="35" y="744.63" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#3a2612">ipple-proof</text>
<text x="35" y="767.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#3a2612">cd ripple-proof</text>
<text x="35" y="791.13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#3a2612">PYTHONPATH=src python -S -m lineage_agent</text>
<text x="35" y="814.38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#3a2612">.cli demo</text>
<text x="26" y="853.83" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#7a5f3c">Expect CAMPAIGN AUDIT: PASSED, 11 of 11 checks.</text>
<text x="26" y="875.58" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#7a5f3c">The walkthrough keeps one run that fails its dbt build</text>
<text x="26" y="897.33" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-weight="400" fill="#7a5f3c">on purpose rather than dropping it.</text>
</svg>
