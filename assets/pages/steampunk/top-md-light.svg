<text x="32" y="33.6" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">I build infrastructure and bounded automation for</text>
<text x="32" y="64.05" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">other people's production systems. Terraform,</text>
<text x="32" y="94.5" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">Kubernetes, CI/CD, and lately agents that act on</text>
<text x="32" y="124.95" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">evidence they can prove instead of guessing.</text>
<text x="32" y="171.15" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">Most of that work is in private client and product</text>
<text x="32" y="201.6" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">repositories, so what is public here is a sample rather</text>
<text x="32" y="232.05" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">than the volume. The contribution graph counts it.</text>
<text x="32" y="262.5" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">The repository list cannot show it.</text>
<text x="32" y="308.7" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">If infrastructure feels exciting, something is probably</text>
<text x="32" y="339.15" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">wrong. The goal is systems that are quiet, predictable,</text>
<text x="32" y="369.6" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="400" fill="#3a2612">and uninteresting in production.</text>
<text x="55.1" y="440.8" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#644514">Want to check whether any of this is real?</text>
<text x="55.1" y="469.95" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">ripple-proof audits a full captured campaign offline in</text>
<text x="55.1" y="496.05" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">about a minute, with Python 3.11 and nothing else. No</text>
<text x="55.1" y="522.15" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">install, no account, no credential, no network call. It prints</text>
<text x="55.1" y="548.25" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#3a2612">every point where it refused to act.</text>
<text x="65.6" y="593.25" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#3a2612">git clone https://github.com/itxcrusher/rippl</text>
<text x="65.6" y="621.15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#3a2612">e-proof</text>
<text x="65.6" y="649.05" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#3a2612">cd ripple-proof</text>
<text x="65.6" y="676.95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#3a2612">PYTHONPATH=src python -S -m lineage_agent.cli</text>
<text x="65.6" y="704.85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#3a2612"> demo</text>
<text x="55.1" y="751.65" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#7a5f3c">Expect CAMPAIGN AUDIT: PASSED, 11 of 11 checks. The</text>
<text x="55.1" y="777.75" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#7a5f3c">walkthrough keeps one run that fails its dbt build on</text>
<text x="55.1" y="803.85" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#7a5f3c">purpose rather than dropping it.</text>
<rect x="0" y="0" width="600" height="10.5" rx="0" fill="#e1caa4" fill-opacity="1"/>
