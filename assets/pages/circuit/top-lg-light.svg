<text x="44" y="30.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0b2a1f">I build infrastructure and bounded automation for other people's</text>
<text x="44" y="57.95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0b2a1f">production systems. Terraform, Kubernetes, CI/CD, and lately agents that</text>
<text x="44" y="85.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0b2a1f">act on evidence they can prove instead of guessing.</text>
<text x="44" y="127.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0b2a1f">Most of that work is in private client and product repositories, so what</text>
<text x="44" y="154.85" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0b2a1f">is public here is a sample rather than the volume. The contribution graph</text>
<text x="44" y="182.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0b2a1f">counts it. The repository list cannot show it.</text>
<text x="44" y="224.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0b2a1f">If infrastructure feels exciting, something is probably wrong. The goal</text>
<text x="44" y="251.75" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="400" fill="#0b2a1f">is systems that are quiet, predictable, and uninteresting in production.</text>
<text x="63.15" y="316.55" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" font-weight="700" fill="#123f8f">Want to check whether any of this is real?</text>
<text x="63.15" y="342.76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">ripple-proof audits a full captured campaign offline in about a minute, with Python</text>
<text x="63.15" y="365.96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">3.11 and nothing else. No install, no account, no credential, no network call. It</text>
<text x="63.15" y="389.16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">prints every point where it refused to act.</text>
<text x="72.65" y="429.46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">git clone https://github.com/itxcrusher/ripple-proof</text>
<text x="72.65" y="454.26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">cd ripple-proof</text>
<text x="72.65" y="479.06" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">PYTHONPATH=src python -S -m lineage_agent.cli demo</text>
<rect x="545.45" y="466.26" width="8" height="16" fill="#123f8f" fill-opacity="0.95" class="a3"/>
<text x="63.15" y="520.96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#4c6f61">Expect CAMPAIGN AUDIT: PASSED, 11 of 11 checks. The walkthrough keeps one run that</text>
<text x="63.15" y="544.16" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#4c6f61">fails its dbt build on purpose rather than dropping it.</text>
