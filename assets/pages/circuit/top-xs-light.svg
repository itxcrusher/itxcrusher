<text x="18" y="25.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">I build infrastructure and</text>
<text x="18" y="48.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">bounded automation for</text>
<text x="18" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">other people's production</text>
<text x="18" y="95.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">systems. Terraform,</text>
<text x="18" y="118.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">Kubernetes, CI/CD, and</text>
<text x="18" y="141.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">lately agents that act on</text>
<text x="18" y="164.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">evidence they can prove</text>
<text x="18" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">instead of guessing.</text>
<text x="18" y="223.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">Most of that work is in</text>
<text x="18" y="246.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">private client and product</text>
<text x="18" y="269.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">repositories, so what is</text>
<text x="18" y="292.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">public here is a sample</text>
<text x="18" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">rather than the volume.</text>
<text x="18" y="339.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">The contribution graph</text>
<text x="18" y="362.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">counts it. The repository</text>
<text x="18" y="385.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">list cannot show it.</text>
<text x="18" y="420.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">If infrastructure feels</text>
<text x="18" y="444" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">exciting, something is</text>
<text x="18" y="467.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">probably wrong. The goal</text>
<text x="18" y="490.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">is systems that are quiet,</text>
<text x="18" y="513.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">predictable, and</text>
<text x="18" y="536.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">uninteresting in</text>
<text x="18" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">production.</text>
<text x="34.6" y="614.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#123f8f">Want to check whether any of this is real?</text>
<text x="34.6" y="636.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">ripple-proof audits a full</text>
<text x="34.6" y="656.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">captured campaign offline</text>
<text x="34.6" y="677.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">in about a minute, with</text>
<text x="34.6" y="697.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">Python 3.11 and nothing</text>
<text x="34.6" y="717.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">else. No install, no</text>
<text x="34.6" y="738.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">account, no credential, no</text>
<text x="34.6" y="758.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">network call. It prints</text>
<text x="34.6" y="778.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">every point where it</text>
<text x="34.6" y="799.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">refused to act.</text>
<text x="42.6" y="833.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">git clone https://github</text>
<text x="42.6" y="855.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">.com/itxcrusher/ripple-p</text>
<text x="42.6" y="877.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">roof</text>
<text x="42.6" y="898.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">cd ripple-proof</text>
<text x="42.6" y="920.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">PYTHONPATH=src python -S</text>
<text x="42.6" y="942.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f"> -m lineage_agent.cli de</text>
<text x="42.6" y="963.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">mo</text>
<rect x="64.524" y="952.78" width="7" height="14" fill="#123f8f" fill-opacity="0.95" class="a3"/>
<text x="34.6" y="1000.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4c6f61">Expect CAMPAIGN AUDIT:</text>
<text x="34.6" y="1020.38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4c6f61">PASSED, 11 of 11 checks.</text>
<text x="34.6" y="1040.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4c6f61">The walkthrough keeps one</text>
<text x="34.6" y="1060.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4c6f61">run that fails its dbt</text>
<text x="34.6" y="1081.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4c6f61">build on purpose rather</text>
<text x="34.6" y="1101.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4c6f61">than dropping it.</text>
