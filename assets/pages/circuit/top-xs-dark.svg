<svg width="280" height="1147" viewBox="0 0 280 1147" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Opening statement and the runnable check</title>
<desc>I build infrastructure and bounded automation for other people's production systems. Terraform, Kubernetes, CI/CD, and lately agents that act on evidence they can prove instead of guessing. Most of that work is in private client and product repositories, so what is public here is a sample rather than the volume. The contribution graph counts it. The repository list cannot show it. If infrastructure feels exciting, something is probably wrong. The goal is systems that are quiet, predictable, and uninteresting in production.</desc>
<rect x="0" y="0" width="280" height="1147" fill="#04140f"/>
<rect x="18" y="811.78" width="244" height="167.9" rx="2.4" fill="#030d0a" fill-opacity="1"/>
<rect x="18" y="581.6" width="244" height="539.88" rx="3.2" fill="#051e15" fill-opacity="1"/>
<rect x="18.75" y="582.35" width="242.5" height="538.38" rx="2.45" fill="none" stroke="#2bff9a" stroke-opacity="0.45" stroke-width="1.4"/>
<rect x="18" y="581.6" width="3" height="539.88" rx="0" fill="#2bff9a" fill-opacity="0.9"/>
<text x="18" y="25.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">I build infrastructure and</text>
<text x="18" y="48.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">bounded automation for</text>
<text x="18" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">other people's production</text>
<text x="18" y="95.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">systems. Terraform,</text>
<text x="18" y="118.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">Kubernetes, CI/CD, and</text>
<text x="18" y="141.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">lately agents that act on</text>
<text x="18" y="164.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">evidence they can prove</text>
<text x="18" y="188" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">instead of guessing.</text>
<text x="18" y="223.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">Most of that work is in</text>
<text x="18" y="246.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">private client and product</text>
<text x="18" y="269.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">repositories, so what is</text>
<text x="18" y="292.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">public here is a sample</text>
<text x="18" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">rather than the volume.</text>
<text x="18" y="339.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">The contribution graph</text>
<text x="18" y="362.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">counts it. The repository</text>
<text x="18" y="385.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">list cannot show it.</text>
<text x="18" y="420.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">If infrastructure feels</text>
<text x="18" y="444" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">exciting, something is</text>
<text x="18" y="467.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">probably wrong. The goal</text>
<text x="18" y="490.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">is systems that are quiet,</text>
<text x="18" y="513.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">predictable, and</text>
<text x="18" y="536.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">uninteresting in</text>
<text x="18" y="560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">production.</text>
<text x="31.6" y="614.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#2bff9a">Want to check whether any of this is real?</text>
<text x="18" y="636.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">ripple-proof audits a full</text>
<text x="18" y="656.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">captured campaign offline</text>
<text x="18" y="677.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">in about a minute, with</text>
<text x="18" y="697.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">Python 3.11 and nothing</text>
<text x="18" y="717.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">else. No install, no</text>
<text x="18" y="738.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">account, no credential, no</text>
<text x="18" y="758.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">network call. It prints</text>
<text x="18" y="778.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">every point where it</text>
<text x="18" y="799.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">refused to act.</text>
<text x="26" y="833.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">git clone https://github</text>
<text x="26" y="855.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">.com/itxcrusher/ripple-p</text>
<text x="26" y="877.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">roof</text>
<text x="26" y="898.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">cd ripple-proof</text>
<text x="26" y="920.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">PYTHONPATH=src python -S</text>
<text x="26" y="942.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5"> -m lineage_agent.cli de</text>
<text x="26" y="963.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">mo</text>
<text x="18" y="1000.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5f9c86">Expect CAMPAIGN AUDIT:</text>
<text x="18" y="1020.38" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5f9c86">PASSED, 11 of 11 checks.</text>
<text x="18" y="1040.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5f9c86">The walkthrough keeps one</text>
<text x="18" y="1060.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5f9c86">run that fails its dbt</text>
<text x="18" y="1081.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5f9c86">build on purpose rather</text>
<text x="18" y="1101.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5f9c86">than dropping it.</text>
</svg>
