<text x="32" y="33.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">I build infrastructure and bounded</text>
<text x="32" y="64.05" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">automation for other people's production</text>
<text x="32" y="94.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">systems. Terraform, Kubernetes, CI/CD, and</text>
<text x="32" y="124.95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">lately agents that act on evidence they can</text>
<text x="32" y="155.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">prove instead of guessing.</text>
<text x="32" y="201.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">Most of that work is in private client and</text>
<text x="32" y="232.05" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">product repositories, so what is public</text>
<text x="32" y="262.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">here is a sample rather than the volume.</text>
<text x="32" y="292.95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">The contribution graph counts it. The</text>
<text x="32" y="323.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">repository list cannot show it.</text>
<text x="32" y="369.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">If infrastructure feels exciting, something</text>
<text x="32" y="400.05" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">is probably wrong. The goal is systems that</text>
<text x="32" y="430.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">are quiet, predictable, and uninteresting</text>
<text x="32" y="460.95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#e8fff5">in production.</text>
<text x="52.85" y="532.15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#2bff9a">Want to check whether any of this is real?</text>
<text x="52.85" y="561.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#e8fff5">ripple-proof audits a full captured campaign</text>
<text x="52.85" y="587.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#e8fff5">offline in about a minute, with Python 3.11 and</text>
<text x="52.85" y="613.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#e8fff5">nothing else. No install, no account, no</text>
<text x="52.85" y="639.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#e8fff5">credential, no network call. It prints every</text>
<text x="52.85" y="665.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#e8fff5">point where it refused to act.</text>
<text x="63.35" y="710.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#e8fff5">git clone https://github.com/itxcrusher/rippl</text>
<text x="63.35" y="738.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#e8fff5">e-proof</text>
<text x="63.35" y="766.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#e8fff5">cd ripple-proof</text>
<text x="63.35" y="794.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#e8fff5">PYTHONPATH=src python -S -m lineage_agent.cli</text>
<text x="63.35" y="822.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#e8fff5"> demo</text>
<rect x="123.02" y="807.9" width="9" height="18" fill="#2bff9a" fill-opacity="0.95" class="a3"/>
<text x="52.85" y="869.1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#5f9c86">Expect CAMPAIGN AUDIT: PASSED, 11 of 11 checks.</text>
<text x="52.85" y="895.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#5f9c86">The walkthrough keeps one run that fails its</text>
<text x="52.85" y="921.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#5f9c86">dbt build on purpose rather than dropping it.</text>
</svg>
