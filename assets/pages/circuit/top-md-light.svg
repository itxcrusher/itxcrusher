<text x="32" y="33.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">I build infrastructure and bounded</text>
<text x="32" y="64.05" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">automation for other people's production</text>
<text x="32" y="94.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">systems. Terraform, Kubernetes, CI/CD, and</text>
<text x="32" y="124.95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">lately agents that act on evidence they can</text>
<text x="32" y="155.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">prove instead of guessing.</text>
<text x="32" y="201.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">Most of that work is in private client and</text>
<text x="32" y="232.05" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">product repositories, so what is public</text>
<text x="32" y="262.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">here is a sample rather than the volume.</text>
<text x="32" y="292.95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">The contribution graph counts it. The</text>
<text x="32" y="323.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">repository list cannot show it.</text>
<text x="32" y="369.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">If infrastructure feels exciting, something</text>
<text x="32" y="400.05" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">is probably wrong. The goal is systems that</text>
<text x="32" y="430.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">are quiet, predictable, and uninteresting</text>
<text x="32" y="460.95" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="400" fill="#0b2a1f">in production.</text>
<text x="52.85" y="532.15" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#123f8f">Want to check whether any of this is real?</text>
<text x="52.85" y="561.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#0b2a1f">ripple-proof audits a full captured campaign</text>
<text x="52.85" y="587.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#0b2a1f">offline in about a minute, with Python 3.11 and</text>
<text x="52.85" y="613.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#0b2a1f">nothing else. No install, no account, no</text>
<text x="52.85" y="639.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#0b2a1f">credential, no network call. It prints every</text>
<text x="52.85" y="665.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#0b2a1f">point where it refused to act.</text>
<text x="63.35" y="710.7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#0b2a1f">git clone https://github.com/itxcrusher/rippl</text>
<text x="63.35" y="738.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#0b2a1f">e-proof</text>
<text x="63.35" y="766.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#0b2a1f">cd ripple-proof</text>
<text x="63.35" y="794.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#0b2a1f">PYTHONPATH=src python -S -m lineage_agent.cli</text>
<text x="63.35" y="822.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#0b2a1f"> demo</text>
<rect x="123.02" y="807.9" width="9" height="18" fill="#123f8f" fill-opacity="0.95" class="a3"/>
<text x="52.85" y="869.1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#4c6f61">Expect CAMPAIGN AUDIT: PASSED, 11 of 11 checks.</text>
<text x="52.85" y="895.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#4c6f61">The walkthrough keeps one run that fails its</text>
<text x="52.85" y="921.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="400" fill="#4c6f61">dbt build on purpose rather than dropping it.</text>
</svg>
