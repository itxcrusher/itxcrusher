<text x="26" y="25.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">I build infrastructure and bounded</text>
<text x="26" y="48.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">automation for other people's production</text>
<text x="26" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">systems. Terraform, Kubernetes, CI/CD, and</text>
<text x="26" y="95.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">lately agents that act on evidence they can</text>
<text x="26" y="118.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">prove instead of guessing.</text>
<text x="26" y="153.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">Most of that work is in private client and</text>
<text x="26" y="176.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">product repositories, so what is public</text>
<text x="26" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">here is a sample rather than the volume.</text>
<text x="26" y="223.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">The contribution graph counts it. The</text>
<text x="26" y="246.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">repository list cannot show it.</text>
<text x="26" y="281.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">If infrastructure feels exciting, something</text>
<text x="26" y="304.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">is probably wrong. The goal is systems that</text>
<text x="26" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">are quiet, predictable, and uninteresting</text>
<text x="26" y="351.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#e8fff5">in production.</text>
<text x="42.6" y="405.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#2bff9a">Want to check whether any of this is real?</text>
<text x="42.6" y="427.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">ripple-proof audits a full captured campaign</text>
<text x="42.6" y="448.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">offline in about a minute, with Python 3.11</text>
<text x="42.6" y="468.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">and nothing else. No install, no account, no</text>
<text x="42.6" y="488.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">credential, no network call. It prints every</text>
<text x="42.6" y="509.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">point where it refused to act.</text>
<text x="50.6" y="543.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">git clone https://github.com/itxcrusher/ripp</text>
<text x="50.6" y="565.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">le-proof</text>
<text x="50.6" y="587.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">cd ripple-proof</text>
<text x="50.6" y="608.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">PYTHONPATH=src python -S -m lineage_agent.cl</text>
<text x="50.6" y="630.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e8fff5">i demo</text>
<rect x="105.172" y="619.38" width="7" height="14" fill="#2bff9a" fill-opacity="0.95" class="a3"/>
<text x="42.6" y="666.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5f9c86">Expect CAMPAIGN AUDIT: PASSED, 11 of 11</text>
<text x="42.6" y="686.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5f9c86">checks. The walkthrough keeps one run that</text>
<text x="42.6" y="707.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5f9c86">fails its dbt build on purpose rather than</text>
<text x="42.6" y="727.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#5f9c86">dropping it.</text>
</svg>
