<text x="26" y="25.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">I build infrastructure and bounded</text>
<text x="26" y="48.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">automation for other people's production</text>
<text x="26" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">systems. Terraform, Kubernetes, CI/CD, and</text>
<text x="26" y="95.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">lately agents that act on evidence they can</text>
<text x="26" y="118.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">prove instead of guessing.</text>
<text x="26" y="153.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">Most of that work is in private client and</text>
<text x="26" y="176.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">product repositories, so what is public</text>
<text x="26" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">here is a sample rather than the volume.</text>
<text x="26" y="223.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">The contribution graph counts it. The</text>
<text x="26" y="246.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">repository list cannot show it.</text>
<text x="26" y="281.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">If infrastructure feels exciting, something</text>
<text x="26" y="304.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">is probably wrong. The goal is systems that</text>
<text x="26" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">are quiet, predictable, and uninteresting</text>
<text x="26" y="351.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#0b2a1f">in production.</text>
<text x="39.6" y="405.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#123f8f">Want to check whether any of this is real?</text>
<text x="26" y="427.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">ripple-proof audits a full captured campaign</text>
<text x="26" y="448.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">offline in about a minute, with Python 3.11</text>
<text x="26" y="468.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">and nothing else. No install, no account, no</text>
<text x="26" y="488.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">credential, no network call. It prints every</text>
<text x="26" y="509.08" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">point where it refused to act.</text>
<text x="34" y="543.78" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">git clone https://github.com/itxcrusher/ripp</text>
<text x="34" y="565.48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">le-proof</text>
<text x="34" y="587.18" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">cd ripple-proof</text>
<text x="34" y="608.88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">PYTHONPATH=src python -S -m lineage_agent.cl</text>
<text x="34" y="630.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#0b2a1f">i demo</text>
<rect x="102.172" y="619.38" width="7" height="14" fill="#123f8f" fill-opacity="0.95" class="a3"/>
<text x="26" y="666.68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4c6f61">Expect CAMPAIGN AUDIT: PASSED, 11 of 11</text>
<text x="26" y="686.98" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4c6f61">checks. The walkthrough keeps one run that</text>
<text x="26" y="707.28" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4c6f61">fails its dbt build on purpose rather than</text>
<text x="26" y="727.58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#4c6f61">dropping it.</text>
</svg>
