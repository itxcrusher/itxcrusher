<svg width="460" height="781" viewBox="0 0 460 781" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">Opening statement and the runnable check</title>
<desc>I build infrastructure and bounded automation for other people's production systems. Terraform, Kubernetes, CI/CD, and lately agents that act on evidence they can prove instead of guessing. Most of that work is in private client and product repositories, so what is public here is a sample rather than the volume. The contribution graph counts it. The repository list cannot show it. If infrastructure feels exciting, something is probably wrong. The goal is systems that are quiet, predictable, and uninteresting in production.</desc>
<style>@keyframes k2{0%,49%{opacity:1}50%,100%{opacity:0}}.a3{animation:k2 1.1s steps(1) infinite}</style>
