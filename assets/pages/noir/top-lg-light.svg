<text x="44" y="30.4" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#101012">I build infrastructure and bounded automation for other people's production systems.</text>
<text x="44" y="57.95" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#101012">Terraform, Kubernetes, CI/CD, and lately agents that act on evidence they can prove</text>
<text x="44" y="85.5" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#101012">instead of guessing.</text>
<text x="44" y="127.3" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#101012">Most of that work is in private client and product repositories, so what is public here is a</text>
<text x="44" y="154.85" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#101012">sample rather than the volume. The contribution graph counts it. The repository list cannot</text>
<text x="44" y="182.4" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#101012">show it.</text>
<text x="44" y="224.2" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#101012">If infrastructure feels exciting, something is probably wrong. The goal is systems that are</text>
<text x="44" y="251.75" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="400" fill="#101012">quiet, predictable, and uninteresting in production.</text>
<text x="60.15" y="316.55" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#202024">Want to check whether any of this is real?</text>
<text x="44" y="342.76" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#101012">ripple-proof audits a full captured campaign offline in about a minute, with Python 3.11 and nothing</text>
<text x="44" y="365.96" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#101012">else. No install, no account, no credential, no network call. It prints every point where it refused to act.</text>
<text x="53.5" y="406.26" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#101012">git clone https://github.com/itxcrusher/ripple-proof</text>
<text x="53.5" y="431.06" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#101012">cd ripple-proof</text>
<text x="53.5" y="455.86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#101012">PYTHONPATH=src python -S -m lineage_agent.cli demo</text>
<text x="44" y="497.76" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#55555a">Expect CAMPAIGN AUDIT: PASSED, 11 of 11 checks. The walkthrough keeps one run that fails its dbt</text>
<text x="44" y="520.96" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#55555a">build on purpose rather than dropping it.</text>
</svg>
