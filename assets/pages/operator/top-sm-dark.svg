<text x="26" y="25.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">I build infrastructure and bounded</text>
<text x="26" y="48.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">automation for other people's production</text>
<text x="26" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">systems. Terraform, Kubernetes, CI/CD, and</text>
<text x="26" y="95.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">lately agents that act on evidence they can</text>
<text x="26" y="118.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">prove instead of guessing.</text>
<text x="26" y="153.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">Most of that work is in private client and</text>
<text x="26" y="176.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">product repositories, so what is public</text>
<text x="26" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">here is a sample rather than the volume.</text>
<text x="26" y="223.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">The contribution graph counts it. The</text>
<text x="26" y="246.4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">repository list cannot show it.</text>
<text x="26" y="281.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">If infrastructure feels exciting, something</text>
<text x="26" y="304.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">is probably wrong. The goal is systems that</text>
<text x="26" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">are quiet, predictable, and uninteresting</text>
<text x="26" y="351.2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#d7e6d5">in production.</text>
<text x="41.2" y="419.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d7e6d5">ripple-proof audits a full captured campaign</text>
<text x="41.2" y="440.22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d7e6d5">offline in about a minute, with Python 3.11</text>
<text x="41.2" y="460.52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d7e6d5">and nothing else. No install, no account, no</text>
<text x="41.2" y="480.82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d7e6d5">credential, no network call. It prints every</text>
<text x="41.2" y="501.12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d7e6d5">point where it refused to act.</text>
<text x="49.2" y="535.82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3dff8f">$</text>
<text x="65.524" y="535.82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d7e6d5">git clone https://github.com/itxcrusher/ri</text>
<text x="49.2" y="557.52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d7e6d5">pple-proof</text>
<text x="49.2" y="579.22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3dff8f">$</text>
<text x="65.524" y="579.22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d7e6d5">cd ripple-proof</text>
<text x="49.2" y="600.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3dff8f">$</text>
<text x="65.524" y="600.92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d7e6d5">PYTHONPATH=src python -S -m lineage_agent.</text>
<text x="49.2" y="622.62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#d7e6d5">cli demo</text>
<rect x="120.096" y="611.42" width="7" height="14" fill="#3dff8f" fill-opacity="0.95" class="a7"/>
<text x="41.2" y="658.72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6f8a7a">Expect CAMPAIGN AUDIT: PASSED, 11 of 11</text>
<text x="41.2" y="679.02" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6f8a7a">checks. The walkthrough keeps one run that</text>
<text x="41.2" y="699.32" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6f8a7a">fails its dbt build on purpose rather than</text>
<text x="41.2" y="719.62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#6f8a7a">dropping it.</text>
<text x="82.8" y="389.84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#6f8a7a">Want to check whether any of this is real?</text>
