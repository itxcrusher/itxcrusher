<svg width="600" height="634" viewBox="0 0 600 634" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0ead0" stop-opacity="1"/><stop offset="1" stop-color="#f4f7ec" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="600" height="634" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="634" rx="0" fill="#245f2d" fill-opacity="0.9"/>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">I build infrastructure and bounded</text>
<text x="40" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">automation for other people's</text>
<text x="40" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">production systems. Terraform,</text>
<text x="40" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">Kubernetes, CI/CD, and lately agents</text>
<text x="40" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">that act on evidence they can prove</text>
<text x="40" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">instead of guessing.</text>
<text x="40" y="259" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">Most of that work is in private client</text>
<text x="40" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">and product repositories, so what is</text>
<text x="40" y="323" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">public here is a sample rather than</text>
<text x="40" y="355" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">the volume. The contribution graph</text>
<text x="40" y="387" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">counts it. The repository list cannot</text>
<text x="40" y="419" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">show it.</text>
<text x="40" y="466" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">If infrastructure feels exciting,</text>
<text x="40" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">something is probably wrong. The goal</text>
<text x="40" y="530" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">is systems that are quiet,</text>
<text x="40" y="562" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">predictable, and uninteresting in</text>
<text x="40" y="594" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#1d2a1c">production.</text>
</svg>
