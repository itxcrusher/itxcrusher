<svg width="280" height="726" viewBox="0 0 280 726" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0ead0" stop-opacity="1"/><stop offset="1" stop-color="#f4f7ec" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="280" height="726" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="726" rx="0" fill="#245f2d" fill-opacity="0.9"/>
<text x="40" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">I build infrastructure</text>
<text x="40" y="69" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">and bounded automation</text>
<text x="40" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">for other people's</text>
<text x="40" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">production systems.</text>
<text x="40" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">Terraform, Kubernetes,</text>
<text x="40" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">CI/CD, and lately</text>
<text x="40" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">agents that act on</text>
<text x="40" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">evidence they can</text>
<text x="40" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">prove instead of</text>
<text x="40" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">guessing.</text>
<text x="40" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">Most of that work is</text>
<text x="40" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">in private client and</text>
<text x="40" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">product repositories,</text>
<text x="40" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">so what is public here</text>
<text x="40" y="379" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">is a sample rather</text>
<text x="40" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">than the volume. The</text>
<text x="40" y="425" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">contribution graph</text>
<text x="40" y="448" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">counts it. The</text>
<text x="40" y="471" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">repository list cannot</text>
<text x="40" y="494" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">show it.</text>
<text x="40" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">If infrastructure</text>
<text x="40" y="551" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">feels exciting,</text>
<text x="40" y="574" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">something is probably</text>
<text x="40" y="597" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">wrong. The goal is</text>
<text x="40" y="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">systems that are</text>
<text x="40" y="643" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">quiet, predictable,</text>
<text x="40" y="666" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">and uninteresting in</text>
<text x="40" y="689" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#1d2a1c">production.</text>
</svg>
