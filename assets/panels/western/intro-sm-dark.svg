<svg width="460" height="528" viewBox="0 0 460 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#552910" stop-opacity="1"/><stop offset="1" stop-color="#2a1206" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="460" height="528" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="528" rx="0" fill="#ff9d3a" fill-opacity="0.9"/>
<text x="40" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">I build infrastructure and bounded</text>
<text x="40" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">automation for other people's</text>
<text x="40" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">production systems. Terraform,</text>
<text x="40" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">Kubernetes, CI/CD, and lately</text>
<text x="40" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">agents that act on evidence they</text>
<text x="40" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">can prove instead of guessing.</text>
<text x="40" y="217" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">Most of that work is in private</text>
<text x="40" y="243" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">client and product repositories,</text>
<text x="40" y="269" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">so what is public here is a sample</text>
<text x="40" y="295" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">rather than the volume. The</text>
<text x="40" y="321" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">contribution graph counts it. The</text>
<text x="40" y="347" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">repository list cannot show it.</text>
<text x="40" y="386" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">If infrastructure feels exciting,</text>
<text x="40" y="412" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">something is probably wrong. The</text>
<text x="40" y="438" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">goal is systems that are quiet,</text>
<text x="40" y="464" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">predictable, and uninteresting in</text>
<text x="40" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" fill="#ffe8c8">production.</text>
</svg>
