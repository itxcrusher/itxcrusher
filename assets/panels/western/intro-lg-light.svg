<svg width="900" height="551" viewBox="0 0 900 551" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dcbe8c" stop-opacity="1"/><stop offset="1" stop-color="#f5e9d0" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="900" height="551" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="551" rx="0" fill="#763c12" fill-opacity="0.9"/>
<text x="40" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">I build infrastructure and bounded automation for other</text>
<text x="40" y="99" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">people's production systems. Terraform, Kubernetes, CI/CD,</text>
<text x="40" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">and lately agents that act on evidence they can prove instead of</text>
<text x="40" y="181" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">guessing.</text>
<text x="40" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">Most of that work is in private client and product repositories,</text>
<text x="40" y="283" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">so what is public here is a sample rather than the volume. The</text>
<text x="40" y="324" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">contribution graph counts it. The repository list cannot show</text>
<text x="40" y="365" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">it.</text>
<text x="40" y="426" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">If infrastructure feels exciting, something is probably wrong.</text>
<text x="40" y="467" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">The goal is systems that are quiet, predictable, and</text>
<text x="40" y="508" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="400" fill="#3a230c">uninteresting in production.</text>
</svg>
