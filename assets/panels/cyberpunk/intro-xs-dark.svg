<svg width="280" height="726" viewBox="0 0 280 726" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#160b30" stop-opacity="1"/><stop offset="1" stop-color="#07060f" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="280" height="726" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="726" rx="0" fill="#ff2bd6" fill-opacity="0.9"/>
<text x="40" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">I build infrastructure</text>
<text x="40" y="69" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">and bounded automation</text>
<text x="40" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">for other people's</text>
<text x="40" y="115" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">production systems.</text>
<text x="40" y="138" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">Terraform, Kubernetes,</text>
<text x="40" y="161" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">CI/CD, and lately</text>
<text x="40" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">agents that act on</text>
<text x="40" y="207" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">evidence they can</text>
<text x="40" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">prove instead of</text>
<text x="40" y="253" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">guessing.</text>
<text x="40" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">Most of that work is</text>
<text x="40" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">in private client and</text>
<text x="40" y="333" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">product repositories,</text>
<text x="40" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">so what is public here</text>
<text x="40" y="379" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">is a sample rather</text>
<text x="40" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">than the volume. The</text>
<text x="40" y="425" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">contribution graph</text>
<text x="40" y="448" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">counts it. The</text>
<text x="40" y="471" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">repository list cannot</text>
<text x="40" y="494" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">show it.</text>
<text x="40" y="528" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">If infrastructure</text>
<text x="40" y="551" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">feels exciting,</text>
<text x="40" y="574" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">something is probably</text>
<text x="40" y="597" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">wrong. The goal is</text>
<text x="40" y="620" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">systems that are</text>
<text x="40" y="643" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">quiet, predictable,</text>
<text x="40" y="666" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">and uninteresting in</text>
<text x="40" y="689" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="400" fill="#f7f3ff">production.</text>
</svg>
