<svg width="900" height="592" viewBox="0 0 900 592" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1628" stop-opacity="1"/><stop offset="1" stop-color="#060a12" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="900" height="592" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="592" rx="0" fill="#ffc94a" fill-opacity="0.9"/>
<text x="40" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">I build infrastructure and bounded automation for</text>
<text x="40" y="99" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">other people's production systems. Terraform,</text>
<text x="40" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">Kubernetes, CI/CD, and lately agents that act on</text>
<text x="40" y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">evidence they can prove instead of guessing.</text>
<text x="40" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">Most of that work is in private client and product</text>
<text x="40" y="283" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">repositories, so what is public here is a sample</text>
<text x="40" y="324" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">rather than the volume. The contribution graph</text>
<text x="40" y="365" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">counts it. The repository list cannot show it.</text>
<text x="40" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">If infrastructure feels exciting, something is</text>
<text x="40" y="467" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">probably wrong. The goal is systems that are</text>
<text x="40" y="508" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">quiet, predictable, and uninteresting in</text>
<text x="40" y="549" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="28" font-weight="400" fill="#e8f1ff">production.</text>
</svg>
