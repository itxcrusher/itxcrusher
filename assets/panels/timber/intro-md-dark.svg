<svg width="600" height="634" viewBox="0 0 600 634" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33200f" stop-opacity="1"/><stop offset="1" stop-color="#1c120b" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="600" height="634" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="634" rx="0" fill="#e0a25c" fill-opacity="0.9"/>
<text x="40" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">I build infrastructure and bounded</text>
<text x="40" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">automation for other people's</text>
<text x="40" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">production systems. Terraform,</text>
<text x="40" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">Kubernetes, CI/CD, and lately agents</text>
<text x="40" y="180" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">that act on evidence they can prove</text>
<text x="40" y="212" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">instead of guessing.</text>
<text x="40" y="259" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">Most of that work is in private client</text>
<text x="40" y="291" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">and product repositories, so what is</text>
<text x="40" y="323" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">public here is a sample rather than</text>
<text x="40" y="355" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">the volume. The contribution graph</text>
<text x="40" y="387" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">counts it. The repository list cannot</text>
<text x="40" y="419" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">show it.</text>
<text x="40" y="466" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">If infrastructure feels exciting,</text>
<text x="40" y="498" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">something is probably wrong. The goal</text>
<text x="40" y="530" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">is systems that are quiet,</text>
<text x="40" y="562" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">predictable, and uninteresting in</text>
<text x="40" y="594" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">production.</text>
</svg>
