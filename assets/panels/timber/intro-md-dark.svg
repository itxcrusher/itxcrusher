<svg width="600" height="442" viewBox="0 0 600 442" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33200f" stop-opacity="1"/><stop offset="1" stop-color="#1c120b" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="600" height="442" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="442" rx="0" fill="#e0a25c" fill-opacity="0.9"/>
<text x="40" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">I build infrastructure and bounded automation for</text>
<text x="40" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">other people's production systems. Terraform,</text>
<text x="40" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">Kubernetes, CI/CD, and lately agents that act on</text>
<text x="40" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">evidence they can prove instead of guessing.</text>
<text x="40" y="195" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">Most of that work is in private client and product</text>
<text x="40" y="227" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">repositories, so what is public here is a sample</text>
<text x="40" y="259" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">rather than the volume. The contribution graph</text>
<text x="40" y="291" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">counts it. The repository list cannot show it.</text>
<text x="40" y="338" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">If infrastructure feels exciting, something is</text>
<text x="40" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">probably wrong. The goal is systems that are quiet,</text>
<text x="40" y="402" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="400" fill="#f3e6d3">predictable, and uninteresting in production.</text>
</svg>
