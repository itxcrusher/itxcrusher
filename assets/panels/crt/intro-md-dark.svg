<svg width="600" height="538" viewBox="0 0 600 538" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1c0b" stop-opacity="1"/><stop offset="1" stop-color="#061006" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="600" height="538" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="538" rx="0" fill="#35ff5a" fill-opacity="0.9"/>
<text x="40" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">I build infrastructure and bounded</text>
<text x="40" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">automation for other people's production</text>
<text x="40" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">systems. Terraform, Kubernetes, CI/CD,</text>
<text x="40" y="148" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">and lately agents that act on evidence</text>
<text x="40" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">they can prove instead of guessing.</text>
<text x="40" y="227" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">Most of that work is in private client</text>
<text x="40" y="259" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">and product repositories, so what is</text>
<text x="40" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">public here is a sample rather than the</text>
<text x="40" y="323" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">volume. The contribution graph counts it.</text>
<text x="40" y="355" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">The repository list cannot show it.</text>
<text x="40" y="402" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">If infrastructure feels exciting,</text>
<text x="40" y="434" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">something is probably wrong. The goal is</text>
<text x="40" y="466" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">systems that are quiet, predictable, and</text>
<text x="40" y="498" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="400" fill="#b8ffb8">uninteresting in production.</text>
</svg>
