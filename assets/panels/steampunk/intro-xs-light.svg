<svg width="280" height="611" viewBox="0 0 280 611" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfc79e" stop-opacity="1"/><stop offset="1" stop-color="#f3e9d8" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="280" height="611" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="611" rx="0" fill="#644514" fill-opacity="0.9"/>
<text x="40" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">I build infrastructure and</text>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">bounded automation for</text>
<text x="40" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">other people's production</text>
<text x="40" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">systems. Terraform,</text>
<text x="40" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">Kubernetes, CI/CD, and</text>
<text x="40" y="161" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">lately agents that act on</text>
<text x="40" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">evidence they can prove</text>
<text x="40" y="207" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">instead of guessing.</text>
<text x="40" y="241" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">Most of that work is in</text>
<text x="40" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">private client and product</text>
<text x="40" y="287" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">repositories, so what is</text>
<text x="40" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">public here is a sample</text>
<text x="40" y="333" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">rather than the volume.</text>
<text x="40" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">The contribution graph</text>
<text x="40" y="379" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">counts it. The repository</text>
<text x="40" y="402" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">list cannot show it.</text>
<text x="40" y="436" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">If infrastructure feels</text>
<text x="40" y="459" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">exciting, something is</text>
<text x="40" y="482" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">probably wrong. The goal</text>
<text x="40" y="505" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">is systems that are quiet,</text>
<text x="40" y="528" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">predictable, and</text>
<text x="40" y="551" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">uninteresting in</text>
<text x="40" y="574" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#3a2612">production.</text>
</svg>
