<svg width="280" height="795" viewBox="0 0 280 795" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t">
<title id="t">intro</title>
<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161618" stop-opacity="1"/><stop offset="1" stop-color="#08080a" stop-opacity="1"/></linearGradient></defs>
<rect x="0" y="0" width="280" height="795" fill="url(#g1)"/>
<rect x="0" y="0" width="6" height="795" rx="0" fill="#e6e6e6" fill-opacity="0.9"/>
<text x="40" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">I build</text>
<text x="40" y="69" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">infrastructure and</text>
<text x="40" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">bounded automation</text>
<text x="40" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">for other people's</text>
<text x="40" y="138" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">production systems.</text>
<text x="40" y="161" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">Terraform,</text>
<text x="40" y="184" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">Kubernetes, CI/CD,</text>
<text x="40" y="207" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">and lately agents</text>
<text x="40" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">that act on evidence</text>
<text x="40" y="253" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">they can prove</text>
<text x="40" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">instead of guessing.</text>
<text x="40" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">Most of that work is</text>
<text x="40" y="333" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">in private client</text>
<text x="40" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">and product</text>
<text x="40" y="379" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">repositories, so</text>
<text x="40" y="402" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">what is public here</text>
<text x="40" y="425" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">is a sample rather</text>
<text x="40" y="448" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">than the volume. The</text>
<text x="40" y="471" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">contribution graph</text>
<text x="40" y="494" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">counts it. The</text>
<text x="40" y="517" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">repository list</text>
<text x="40" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">cannot show it.</text>
<text x="40" y="574" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">If infrastructure</text>
<text x="40" y="597" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">feels exciting,</text>
<text x="40" y="620" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">something is</text>
<text x="40" y="643" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">probably wrong. The</text>
<text x="40" y="666" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">goal is systems that</text>
<text x="40" y="689" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">are quiet,</text>
<text x="40" y="712" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">predictable, and</text>
<text x="40" y="735" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">uninteresting in</text>
<text x="40" y="758" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f2f2f2">production.</text>
</svg>
