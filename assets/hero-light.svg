  </style>
  <text x="2" y="58" fill="#1f2328" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.2">Muhammad Hassaan Javed</text>
  <text x="2" y="110" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="42" font-weight="700">@itxcrusher</text>
  <line class="rule" x1="2" y1="136" x2="898" y2="136" stroke="#d1d9e0" stroke-width="2" stroke-linecap="round"/>
