<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title">
  <title id="hero-title">Muhammad Hassaan Javed, GitHub handle itxcrusher</title>
  <style>
    .rule { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.1s cubic-bezier(.2,.7,.3,1) .15s forwards; }
