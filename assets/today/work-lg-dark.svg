<text x="44" y="69.1" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" fill="#d4a24c">Public Works</text>
<text x="44" y="105.16" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#b39a72">22 original public repositories. Most of the work is not here: over the last 12 months, 5,527 of 6,636</text>
<text x="44" y="128.36" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#b39a72">contributions were in private repositories (client delivery, product builds, and security research).</text>
<text x="57.3" y="183.26" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#d4a24c">ripple-proof</text>
<text x="44" y="208.14" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">Bounded PostgreSQL column-rename agent: turns DataHub lineage evidence into validated dbt repairs</text>
<text x="44" y="231.34" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">across repositories, refuses ambiguous or stale evidence, and stops at human-reviewed pull requests</text>
<text x="57.3" y="256.82" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="500" fill="#b39a72">Python, updated 2026-08-09</text>
<text x="57.3" y="319.52" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#d4a24c">vision-ai-poc</text>
<text x="44" y="344.4" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">Real-time people detection, per-zone counting and dwell tracking with YOLOv8, ByteTrack and OpenCV.</text>
<text x="44" y="367.6" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">Runs as a local GUI demo or headless against RTSP cameras with server-fetched zones and privacy</text>
<text x="44" y="390.8" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">masking</text>
<text x="57.3" y="416.28" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="500" fill="#b39a72">Python, updated 2026-08-26</text>
<text x="57.3" y="478.98" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#d4a24c">kind-cluster-recovery</text>
<text x="44" y="503.86" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">Four-node KIND cluster provisioned onto a remote host with Terraform over SSH, then debugged:</text>
<text x="44" y="527.06" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">CoreDNS Corefile repair, crash-loop recovery, and a least-privilege NetworkPolicy expressed in</text>
<text x="44" y="550.26" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">Terraform</text>
<text x="57.3" y="575.74" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="500" fill="#b39a72">HCL, updated 2026-08-26</text>
<text x="57.3" y="638.44" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#d4a24c">k8s-gitops-platform</text>
<text x="44" y="663.32" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">ArgoCD app-of-apps GitOps configuration for a 17-service Kubernetes platform: parameterised Helm</text>
<text x="44" y="686.52" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">charts, an ELK logging stack, and cert-manager across three environments. Generalised from production</text>
<text x="57.3" y="712" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="500" fill="#b39a72">updated 2026-08-22</text>
<text x="57.3" y="774.7" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#d4a24c">wordpress-fargate-deployment</text>
<text x="44" y="799.58" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">AWS CloudFormation template and helper scripts to deploy a production-ready WordPress environment</text>
<text x="44" y="822.78" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">on AWS Fargate with RDS, EFS, and an Application Load Balancer</text>
<text x="57.3" y="848.26" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="500" fill="#b39a72">Shell, updated 2025-08-08</text>
<text x="57.3" y="910.96" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#d4a24c">azure-devops-demo</text>
<text x="44" y="935.84" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">End-to-end Terraform and GitHub Actions pipeline that deploys a containerized service to Azure, with</text>
<text x="44" y="959.04" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#f4e6cf">six reusable Terraform modules</text>
<text x="57.3" y="984.52" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="500" fill="#b39a72">HCL, updated 2025-05-16</text>
<text x="44" y="1029.77" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#b39a72">Evidence trail for ripple-proof runs across four public sibling dbt repositories: analytics, finance, growth,</text>
<text x="44" y="1052.97" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#b39a72">operations. All open and review-only.</text>
<text x="44" y="1081.87" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#b39a72">Generated 2026-08-28 from the GitHub API.</text>
<text x="44" y="1152.47" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" fill="#d4a24c">The Engine</text>
<text x="44" y="1188.53" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#b39a72">Everything in the operating stack below has a public artifact in this account. Work that does not is in private</text>
<text x="44" y="1211.73" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="400" fill="#b39a72">repositories and is not listed here.</text>
