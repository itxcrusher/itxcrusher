name: profile-review

# A profile rots quietly. This opens one issue a quarter with the checklist, because
# nothing else will remind anyone that a description drifted or a link died.

on:
  schedule:
    - cron: "0 9 1 1,4,7,10 *"
  workflow_dispatch:

permissions: {}

jobs:
  open-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # No checkout. The body is inline because the full review procedure is
      # control-plane material and lives in the private workspace, not in this public
      # repository, so there is no file here to read.
      - name: open the quarterly review issue
        run: |
          set -euo pipefail
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Quarterly profile review: $(date -u '+%Y-%m')" \
            --body "- [ ] Open the profile logged out, in light mode, on a phone. Look at it.
          - [ ] Does the snake render? Is the Generated stamp under two weeks old?
          - [ ] Click every link in the README.
          - [ ] Run the demo from a fresh clone; it must still print CAMPAIGN AUDIT: PASSED.
          - [ ] Are both upstream PRs still open? Does every stack line still have a public artifact?
          - [ ] Do the showcased repo descriptions still match what those repos contain?"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
